# Publishes the web app (static/) to GitHub Pages on every push to main.
# In browser mode it calls FACEIT/Leetify directly; keys and history stay in each visitor's browser.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Optional: bake a FACEIT *Client side* key into the site so visitors can search by
      # nickname without entering a key. Set it under Settings -> Secrets -> Actions.
      # NEVER use a Server side key here: it would be public in the deployed site.
      - name: Inject FACEIT client key
        env:
          FACEIT_CLIENT_KEY: ${{ secrets.FACEIT_CLIENT_KEY }}
        run: |
          if [ -n "$FACEIT_CLIENT_KEY" ]; then
            printf 'window.CS2_CONFIG = { faceitApiKey: %s };\n' "$(jq -Rn --arg k "$FACEIT_CLIENT_KEY" '$k')" > static/config.js
            echo "FACEIT client key injected"
          else
            echo "No FACEIT_CLIENT_KEY secret - visitors enter their own key"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - id: deployment
        uses: actions/deploy-pages@v4
