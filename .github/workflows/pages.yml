# Publishes the web app (static/) to GitHub Pages on every push to main.
# In browser mode it calls FACEIT/Leetify directly; keys and history stay in each visitor's browser.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Optional FACEIT keys from repo secrets (Settings -> Secrets and variables -> Actions):
      #   FACEIT_KEY_LOCKED  - a key encrypted with a password ("Lock a key" in the app's Settings);
      #                        safe for a Server side key, visitors must sign in to use it.
      #   FACEIT_CLIENT_KEY  - a plain *Client side* key anyone can use. NEVER a Server side key.
      - name: Inject FACEIT keys
        env:
          FACEIT_CLIENT_KEY: ${{ secrets.FACEIT_CLIENT_KEY }}
          FACEIT_KEY_LOCKED: ${{ secrets.FACEIT_KEY_LOCKED }}
        run: |
          jq -n --arg c "$FACEIT_CLIENT_KEY" --arg l "$FACEIT_KEY_LOCKED" '{faceitApiKey: $c, faceitKeyLocked: $l}' \
            | { printf 'window.CS2_CONFIG = '; cat; printf ';\n'; } > static/config.js
          echo "client key: $([ -n "$FACEIT_CLIENT_KEY" ] && echo set || echo none) | locked key: $([ -n "$FACEIT_KEY_LOCKED" ] && echo set || echo none)"
      # Cache-busting: each deploy gets new asset URLs, so browsers load the update without Ctrl+F5.
      - name: Stamp asset version
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" static/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - id: deployment
        uses: actions/deploy-pages@v4
