<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CS2 Tracker settings</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #111110; color: #eceae4; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; } h1 b { color: #ff7a45; }
  h2 { font-size: 15px; margin: 0 0 6px; }
  .card { background: #1a1a19; border: 1px solid #2e2e2b; border-radius: 12px; padding: 16px; margin-top: 16px; }
  .muted { color: #9a988f; font-size: 13px; }
  label { display: block; margin-top: 10px; font-size: 13px; color: #c3c2b7; }
  input[type=text], input[type=password] { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 8px 10px; border-radius: 8px; border: 1px solid #34342f; background: #232321; color: #eceae4; font: inherit; }
  button { margin-top: 10px; padding: 7px 14px; border: 0; border-radius: 8px; background: #ff7a45; color: #111; font-weight: 700; font: inherit; font-weight: 700; cursor: pointer; }
  button.ghost { background: #2a2a27; color: #eceae4; }
  .status { margin-top: 8px; font-size: 13px; }
  .ok { color: #4cc94c; } .err { color: #ef7d7d; }
  .row { display: flex; gap: 8px; align-items: center; }
  .or { text-align: center; margin: 14px 0 0; color: #6f6e68; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1><b>CS2 Tracker</b> for FACEIT</h1>
  <div class="muted">Hover cards and a map veto helper in FACEIT match rooms. Everything stays in this browser.</div>

  <div class="card">
    <h2>FACEIT access</h2>
    <div class="status" id="keyStatus">Checking…</div>
    <label>Sign in with your CS2 Tracker site password
      <input type="password" id="pw" autocomplete="current-password" placeholder="Same password as on the website"></label>
    <button id="unlock">Sign in</button>
    <div class="or">— or —</div>
    <label>Paste a FACEIT API key
      <input type="password" id="key" autocomplete="off" placeholder="From developers.faceit.com"></label>
    <div class="row"><button id="saveKey">Save key</button><button class="ghost" id="signOut">Remove key / sign out</button></div>
    <div class="status" id="keyMsg"></div>
  </div>

  <div class="card">
    <h2>Your FACEIT nickname</h2>
    <div class="muted">Used to tell your team from the opponents, so the panel can show “us vs them” and ban suggestions.</div>
    <input type="text" id="me" placeholder="e.g. OGDerpinator">
    <button id="saveMe">Save</button>
    <div class="status" id="meMsg"></div>
  </div>
</main>
<script src="options.js"></script>
</body>
</html>
